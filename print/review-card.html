<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nomad Manti — Table Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Print on US Letter: two 5.5" x 8.5" cards per sheet, cut down the middle. */
    @page { size: letter landscape; margin: 0; }
    :root { --felt: #8c2219; --felt-deep: #5b1510; --saffron: #e9a83c; --cream: #f3eadb; --ink: #14100d; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #ddd; font-family: "Jost", sans-serif; color: var(--ink); }
    .sheet { display: flex; justify-content: center; gap: 0; padding: 24px; }
    .card {
      width: 5.5in; height: 8.5in; background: var(--cream);
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: .45in .4in .35in; position: relative; overflow: hidden;
      border-right: 1px dashed #bbb;
    }
    .card:last-child { border-right: 0; }
    .band { position: absolute; left: 0; right: 0; height: .32in; background: var(--felt-deep); color: var(--felt); }
    .band--top { top: 0; } .band--bottom { bottom: 0; }
    .band svg { width: 100%; height: 100%; display: block; }
    .mark { width: .7in; height: .7in; color: var(--felt); margin-top: .1in; }
    .kicker { font-size: 10pt; letter-spacing: .3em; text-transform: uppercase; color: var(--felt); margin: .12in 0 0; }
    h1 { font-family: "Cormorant Garamond", serif; font-weight: 300; font-size: 34pt; line-height: 1; margin: .1in 0 .08in; }
    h1 em { color: var(--felt); }
    .lede { font-size: 11pt; margin: 0 0 .18in; max-width: 3.9in; }
    .qr { width: 2.7in; height: 2.7in; padding: .1in; background: #fff; border-radius: .12in; border: 3px solid var(--saffron); }
    .stars { color: var(--saffron); font-size: 22pt; letter-spacing: .1em; margin: .12in 0 0; }
    .cta { font-weight: 500; font-size: 12pt; letter-spacing: .14em; text-transform: uppercase; margin: .04in 0 0; }
    .foot { margin-top: auto; margin-bottom: .3in; display: flex; align-items: center; gap: .18in; text-align: left; font-size: 9pt; }
    .foot img { width: .85in; height: .85in; }
    .foot strong { font-family: "Cormorant Garamond", serif; font-size: 15pt; font-weight: 500; display: block; }
    .thanks { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 16pt; color: var(--felt); margin: .12in 0 0; }
    .tip { text-align: center; font-size: 13px; color: #444; padding: 0 24px 24px; }
    @media print {
      body { background: none; }
      .sheet { padding: 0; }
      .tip { display: none; }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="tunduk" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="3"/>
        <circle cx="50" cy="50" r="25" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M40 22 Q50 50 40 78 M50 20 V80 M60 22 Q50 50 60 78" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <path d="M22 40 Q50 50 78 40 M20 50 H80 M22 60 Q50 50 78 60" fill="none" stroke="currentColor" stroke-width="2.4"/>
      </symbol>
      <symbol id="horn" viewBox="0 0 120 120">
        <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
          <path id="h1" d="M60 60 C60 38 46 26 34 30 C24 34 26 48 36 46 C42 45 42 38 38 37"/>
          <use href="#h1" transform="matrix(-1 0 0 1 120 0)"/>
          <use href="#h1" transform="matrix(1 0 0 -1 0 120)"/>
          <use href="#h1" transform="matrix(-1 0 0 -1 120 120)"/>
        </g>
        <path d="M60 48 L72 60 L60 72 L48 60 Z" fill="currentColor"/>
      </symbol>
      <pattern id="shyrdak" width="40" height="40" patternUnits="userSpaceOnUse">
        <use href="#horn" width="40" height="40" style="color:#a3301f"/>
      </pattern>
    </defs>
  </svg>

  <div class="sheet">
    <template id="cardTpl">
      <article class="card">
        <div class="band band--top"><svg><rect width="100%" height="100%" fill="url(#shyrdak)"/></svg></div>
        <svg class="mark"><use href="#tunduk"/></svg>
        <p class="kicker">Nomad Manti</p>
        <h1>How was your <em>dastorkon?</em></h1>
        <p class="lede">We're a small family kitchen. A quick Google review helps new neighbours find us.</p>
        <img class="qr" src="../assets/qr/google-review.svg" alt="Scan to review Nomad Manti on Google">
        <p class="stars">★★★★★</p>
        <p class="cta">Scan to rate us on Google</p>
        <p class="thanks">Рахмат — thank you!</p>
        <div class="foot">
          <img src="../assets/qr/website.svg" alt="Scan for the Nomad Manti website and menu">
          <div><strong>Menu &amp; delivery</strong>eldarttyy.github.io/nomad-manti<br>800 NE 65th St · Open daily 11–11</div>
        </div>
        <div class="band band--bottom"><svg><rect width="100%" height="100%" fill="url(#shyrdak)"/></svg></div>
      </article>
    </template>
  </div>
  <p class="tip">Print on US Letter, landscape, at 100% scale with "Background graphics" on. Cut down the dashed line for two table cards.</p>

  <script>
    const sheet = document.querySelector('.sheet');
    const tpl = document.getElementById('cardTpl');
    sheet.append(tpl.content.cloneNode(true), tpl.content.cloneNode(true));
  </script>
</body>
</html>
